name: CI

# Manual-only: runs when you click "Run workflow" on GitHub, never automatically.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
        env:
          # placeholders — build-time only, never deployed
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tar
